<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Today’s workout</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --card: #ffffff;
      --ink: #1c1916;
      --mute: #5c564e;
      --line: #ddd6cb;
      --amber: #b45309;
      --amber-soft: #f3e6d4;
      --done: #166534;
      --done-bg: #ecfdf3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    header, main, footer { max-width: 820px; margin: 0 auto; padding: 16px; }
    header { padding-top: 22px; }
    h1 { font-size: 1.55rem; margin: 0 0 6px; }
    .sub { color: var(--mute); margin: 0 0 14px; }
    .today {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .today .kicker { color: var(--amber); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .today h2 { margin: 4px 0 8px; font-size: 1.45rem; }
    .equip {
      background: var(--amber-soft);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }
    .equip strong { display: block; margin-bottom: 4px; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 12px 0; }
    label { font-size: 12px; color: var(--mute); display: block; margin-bottom: 4px; }
    input, button, select {
      font: inherit; border-radius: 8px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); padding: 8px 10px;
    }
    button { cursor: pointer; }
    button.primary { background: var(--amber); color: #fff; border-color: var(--amber); font-weight: 600; }
    .weekdays { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .weekdays button.on { background: var(--amber); color: #fff; border-color: var(--amber); }
    .hero {
      width: 100%; border-radius: 14px; border: 1px solid var(--line);
      display: block; margin: 0 0 16px; background: #fff;
    }
    .hero[hidden] { display: none; }
    .timer[hidden] { display: none; }
    .next-lifts { margin: 0; padding-left: 1.2em; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 16px; margin-bottom: 14px;
    }
    .card h3 { margin: 0 0 6px; font-size: 1.15rem; }
    .meta { color: var(--mute); font-size: 14px; margin: 0 0 8px; }
    .how { margin: 0 0 12px; }
    .sets { display: flex; flex-wrap: wrap; gap: 8px; }
    .set {
      display: flex; align-items: center; gap: 6px;
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #fff;
    }
    .set.done { border-color: var(--done); background: var(--done-bg); }
    .set input[type="number"] { width: 76px; padding: 4px 6px; }
    .note { font-size: 13px; color: var(--mute); margin-top: 10px; }
    .last { font-size: 13px; color: var(--amber); margin: 0 0 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    .timer {
      position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--line);
      padding: 10px 16px; display: flex; gap: 8px; align-items: center; justify-content: center;
    }
    .timer strong { font-size: 1.4rem; min-width: 4ch; text-align: center; }
    .week-status { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
    .pill { font-size: 12px; border-radius: 999px; padding: 3px 8px; border: 1px solid var(--line); }
    .pill.ok { background: var(--done-bg); border-color: var(--done); color: var(--done); }
    .pill.miss { background: #fef2f2; border-color: #b91c1c; color: #b91c1c; }
    .warn { background: #fff7ed; border: 1px solid #fdba74; border-radius: 10px; padding: 10px 12px; margin: 10px 0 0; }
    footer { color: var(--mute); font-size: 13px; padding-bottom: 80px; }
  </style>
</head>
<body>
  <header>
    <h1>What to do today</h1>
    <p class="sub" id="sub">Today’s session from your plan. Check off what you finish.</p>
    <div class="bar">
      <div>
        <label for="start">Plan start (week 1 Monday)</label>
        <input type="date" id="start" />
      </div>
      <div>
        <label for="date">This session</label>
        <input type="date" id="date" />
      </div>
      <button class="primary" id="export" type="button">Export log CSV</button>
    </div>
    <div class="weekdays" id="days"></div>
  </header>
  <main>
    <section class="today" id="banner"></section>
    <img class="hero" id="hero" alt="Session guide" />
    <div id="warmup"></div>
    <div id="checkin"></div>
    <div id="list"></div>
    <div class="row" id="finish"></div>
  </main>
  <div class="timer" id="timer">
    <span>Rest</span>
    <button type="button" data-sec="90">1:30</button>
    <button type="button" data-sec="180">3:00</button>
    <strong id="clock">—</strong>
    <button type="button" id="stop-timer">Stop</button>
  </div>
  <footer id="foot"></footer>
  <script>
    const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const KEY = "recomp-logs-v1";
    const START_KEY = "recomp-start";
    const CHECK_KEY = "recomp-checkin-v1";
    const DONE_KEY = "recomp-sessions-v1";
    let timerId = null;
    let left = 0;

    let PLAN = [];

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = "";
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else inQuotes = false;
          } else field += c;
        } else if (c === '"') {
          inQuotes = true;
        } else if (c === ",") {
          row.push(field);
          field = "";
        } else if (c === "\n" || c === "\r") {
          if (c === "\r" && text[i + 1] === "\n") i++;
          row.push(field);
          field = "";
          if (row.some((x) => x !== "")) rows.push(row);
          row = [];
        } else {
          field += c;
        }
      }
      if (field || row.length) {
        row.push(field);
        rows.push(row);
      }
      return rows;
    }

    async function loadPlan() {
      const res = await fetch("plan.csv");
      if (!res.ok) throw new Error("plan.csv " + res.status);
      const rows = parseCSV(await res.text());
      const headers = rows[0].map((h) => h.trim());
      PLAN = rows.slice(1).map((cols) => {
        const o = {};
        headers.forEach((h, i) => { o[h] = (cols[i] || "").trim(); });
        return {
          weekday: Number(o.weekday),
          focus: o.focus,
          sort: Number(o.sort),
          exercise: o.exercise,
          sets: Number(o.sets) || 1,
          reps: o.reps,
          equipment: o.equipment,
          how: o.how_to || o.how,
          notes: o.notes,
          log: o.log || "weight",
          image: o.image
        };
      });
    }

    const $ = (id) => document.getElementById(id);

    function loadLogs() {
      try { return JSON.parse(localStorage.getItem(KEY) || "{}"); }
      catch { return {}; }
    }
    function saveLogs(logs) { localStorage.setItem(KEY, JSON.stringify(logs)); }

    function weekNumber(start, date) {
      const s = new Date(start + "T00:00:00");
      const d = new Date(date + "T00:00:00");
      return Math.min(12, Math.max(1, Math.floor((d - s) / 86400000 / 7) + 1));
    }
    function logKey(date, exercise, set) { return date + "|" + exercise + "|" + set; }

    function lastWeight(exercise, beforeDate) {
      const logs = loadLogs();
      let best = null;
      Object.values(logs).forEach((r) => {
        if (r.exercise === exercise && r.weight && r.date && r.date < beforeDate) {
          if (!best || r.date > best.date) best = r;
        }
      });
      return best ? best.weight : "";
    }

    function sessionPct(date, wd) {
      const rows = PLAN.filter((r) => r.weekday === wd);
      let total = 0, done = 0;
      const logs = loadLogs();
      rows.forEach((r) => {
        for (let i = 1; i <= r.sets; i++) {
          total++;
          if (logs[logKey(date, r.exercise, i)]?.done) done++;
        }
      });
      return { total, done, pct: total ? Math.round(done / total * 100) : 0 };
    }

    function weekPills(date) {
      const d = new Date(date + "T00:00:00");
      const sunday = new Date(d);
      sunday.setDate(d.getDate() - d.getDay());
      return [1,2,3,4,5,6,0].map((wd) => {
        const day = new Date(sunday);
        day.setDate(sunday.getDate() + wd);
        const iso = day.toISOString().slice(0, 10);
        const focus = (PLAN.find((r) => r.weekday === wd) || {}).focus;
        const { pct } = sessionPct(iso, wd);
        const cls = pct >= 70 ? "ok" : (iso < date && wd !== 0 && wd !== 4 && pct === 0 ? "miss" : "");
        return `<span class="pill ${cls}">${DAYS[wd].slice(0,3)} ${focus} ${pct}%</span>`;
      }).join("");
    }

    function missedNote(date, wd) {
      const d = new Date(date + "T00:00:00");
      const sunday = new Date(d);
      sunday.setDate(d.getDate() - d.getDay());
      const bits = [];
      [1, 2, 3, 5, 6].forEach((check) => {
        const day = new Date(sunday);
        day.setDate(sunday.getDate() + check);
        const iso = day.toISOString().slice(0, 10);
        if (iso >= date) return;
        const focus = (PLAN.find((r) => r.weekday === check) || {}).focus;
        if (sessionPct(iso, check).pct < 40) bits.push(`${DAYS[check]} ${focus}`);
      });
      return bits.length ? `<div class="warn"><strong>Not logged this week:</strong> ${bits.join(", ")}. Do the missed lift if you still have energy, or let it go and don’t stack two heavy days.</div>` : "";
    }

    function startTimer(sec) {
      clearInterval(timerId);
      left = sec;
      $("clock").textContent = fmt(left);
      timerId = setInterval(() => {
        left -= 1;
        $("clock").textContent = fmt(left);
        if (left <= 0) {
          clearInterval(timerId);
          $("clock").textContent = "Go";
          if (navigator.vibrate) navigator.vibrate(200);
        }
      }, 1000);
    }
    function fmt(s) {
      if (s < 0) return "Go";
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }

    function weekday() {
      const picked = $("days").dataset.weekday;
      if (picked !== undefined) return Number(picked);
      return new Date($("date").value + "T00:00:00").getDay();
    }

    function render() {
      const date = $("date").value;
      const wd = weekday();
      const rows = PLAN.filter((r) => r.weekday === wd).sort((a, b) => a.sort - b.sort);
      const week = weekNumber($("start").value, date);
      const focus = rows[0] ? rows[0].focus : "—";
      const gear = [...new Set(rows.map((r) => r.equipment))];

      const prog = sessionPct(date, wd);
      const liftDay = ![0, 4].includes(wd);
      $("sub").textContent = liftDay
        ? "Lifts, equipment, how to do them, last weight, then check sets."
        : "Recovery day. Check these off. No weights today.";
      $("banner").innerHTML = `
        <div class="kicker">Week ${week} of 12 · ${DAYS[wd]} · ${prog.done}/${prog.total} done (${prog.pct}%)</div>
        <h2>Today: ${focus}</h2>
        <div class="equip"><strong>${liftDay ? "Bring / use" : "You need"}</strong>${gear.join(" · ")}</div>
        <div class="week-status">${weekPills(date)}</div>
        ${missedNote(date, wd)}
      `;

      const fri = PLAN.filter((r) => r.weekday === 5).sort((a, b) => a.sort - b.sort);
      if (liftDay) {
        $("warmup").innerHTML = `<article class="card">
          <h3>Warm-up (5–8 min)</h3>
          <p class="how">Easy bike or walk 3 minutes. Then 2 light sets of the first lift before working sets. Don’t skip this on squat / bench / deadlift days.</p>
        </article>`;
      } else if (wd === 4) {
        $("warmup").innerHTML = `<article class="card">
          <h3>No lifting today</h3>
          <p class="how">Walk, mobility, water, sleep. That is the whole session. Tomorrow is Friday upper strength.</p>
          <ul class="next-lifts">${fri.map((r) => `<li><strong>${r.exercise}</strong> — ${r.sets} × ${r.reps}</li>`).join("")}</ul>
          <p class="note">Tap <strong>Fri</strong> only if you are lifting upper body right now.</p>
        </article>`;
      } else {
        $("warmup").innerHTML = `<article class="card">
          <h3>Rest day</h3>
          <p class="how">Optional walk, food prep, glance at last week. Next lift day is Monday Push.</p>
        </article>`;
      }
      $("timer").hidden = !liftDay;
      $("foot").innerHTML = liftDay
        ? "Rest 2–3 minutes on heavy compounds, 60–90 seconds on smaller lifts."
        : "Recovery is the work today. Next lift: Friday upper (bench, row, press, pull-ups).";

      const checks = JSON.parse(localStorage.getItem(CHECK_KEY) || "{}");
      const c = checks[date] || {};
      $("checkin").innerHTML = wd === 6 ? `<article class="card">
        <h3>Saturday check-in</h3>
        <p class="how">Same time, same conditions. Don’t judge the week by scale alone.</p>
        <div class="row">
          <div><label>Weight (lb)</label><input type="number" step="0.1" id="bw" value="${c.weight || ""}" /></div>
          <div><label>Waist (in)</label><input type="number" step="0.1" id="waist" value="${c.waist || ""}" /></div>
          <div><label>Protein on track?</label>
            <select id="protein"><option value="">—</option>
              <option value="yes" ${c.protein==="yes"?"selected":""}>Yes</option>
              <option value="no" ${c.protein==="no"?"selected":""}>No</option>
            </select>
          </div>
          <button type="button" class="primary" id="save-checkin">Save check-in</button>
        </div>
      </article>` : "";

      const hero = $("hero");
      hero.hidden = true;
      hero.alt = "";
      if (rows[0] && rows[0].image) {
        hero.onload = () => { hero.hidden = false; };
        hero.onerror = () => { hero.hidden = true; };
        hero.src = rows[0].image;
      }

      const logs = loadLogs();
      $("list").innerHTML = rows.map((r) => {
        const weighted = r.log !== "check";
        const prev = weighted ? lastWeight(r.exercise, date) : "";
        let sets = "";
        for (let i = 1; i <= r.sets; i++) {
          const k = logKey(date, r.exercise, i);
          const rec = logs[k] || {};
          const w = rec.weight || prev || "";
          sets += `<label class="set ${rec.done ? "done" : ""}">
            <input type="checkbox" data-k="${k}" data-ex="${r.exercise}" data-set="${i}" data-log="${r.log}" ${rec.done ? "checked" : ""} />
            ${weighted ? "Set " + i : "Done"}
            ${weighted ? `<input type="number" min="0" step="0.5" placeholder="lb" data-w="${k}" value="${w}" />` : ""}
          </label>`;
        }
        const lastLine = !weighted ? "" : (prev
          ? `<p class="last">Last time you used ${prev} lb on this lift. Match it or add a little if it was easy.</p>`
          : `<p class="last">First log for this lift — pick a weight you can do with 2 reps left.</p>`);
        return `<article class="card">
          <h3>${r.sort}. ${r.exercise}</h3>
          <p class="meta"><strong>${weighted ? r.sets + " × " + r.reps : r.reps}</strong> · ${r.equipment}</p>
          ${lastLine}
          <p class="how">${r.how}</p>
          <div class="sets">${sets}</div>
          ${r.notes ? `<p class="note">${r.notes}</p>` : ""}
        </article>`;
      }).join("");

      const sessions = JSON.parse(localStorage.getItem(DONE_KEY) || "{}");
      $("finish").innerHTML = `<button type="button" class="primary" id="mark-done">${sessions[date] ? "Session saved" : "Mark session complete"}</button>
        <span class="note">${prog.pct}% done</span>`;

      document.querySelectorAll("#days button").forEach((b) => {
        b.classList.toggle("on", Number(b.dataset.d) === wd);
      });
    }

    async function init() {
      const iso = new Date().toISOString().slice(0, 10);
      $("date").value = iso;
      $("start").value = localStorage.getItem(START_KEY) || "2026-07-28";
      $("days").innerHTML = DAYS.map((n, i) => `<button type="button" data-d="${i}">${n.slice(0,3)}</button>`).join("");
      $("days").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        $("days").dataset.weekday = b.dataset.d;
        render();
      });
      $("date").addEventListener("change", () => { delete $("days").dataset.weekday; render(); });
      $("start").addEventListener("change", () => { localStorage.setItem(START_KEY, $("start").value); render(); });
      $("list").addEventListener("change", (e) => {
        const t = e.target;
        const logs = loadLogs();
        const date = $("date").value;
        if (t.dataset.k) {
          const weightBox = t.parentElement.querySelector("input[type=number]");
          logs[t.dataset.k] = Object.assign(logs[t.dataset.k] || {}, {
            date, exercise: t.dataset.ex, set: t.dataset.set, done: t.checked,
            weight: weightBox ? weightBox.value : (logs[t.dataset.k] || {}).weight
          });
          if (t.checked && t.dataset.log !== "check") startTimer(120);
        }
        if (t.dataset.w) {
          logs[t.dataset.w] = Object.assign(logs[t.dataset.w] || {}, { date, weight: t.value });
        }
        saveLogs(logs);
        render();
      });
      document.addEventListener("click", (e) => {
        if (e.target.id === "save-checkin") {
          const all = JSON.parse(localStorage.getItem(CHECK_KEY) || "{}");
          all[$("date").value] = { weight: $("bw").value, waist: $("waist").value, protein: $("protein").value };
          localStorage.setItem(CHECK_KEY, JSON.stringify(all));
          e.target.textContent = "Saved";
        }
        if (e.target.id === "mark-done") {
          const all = JSON.parse(localStorage.getItem(DONE_KEY) || "{}");
          all[$("date").value] = true;
          localStorage.setItem(DONE_KEY, JSON.stringify(all));
          render();
        }
        if (e.target.dataset.sec) startTimer(Number(e.target.dataset.sec));
        if (e.target.id === "stop-timer") { clearInterval(timerId); $("clock").textContent = "—"; }
      });
      $("export").addEventListener("click", () => {
        const logs = loadLogs();
        const lines = ["date,exercise,set,weight,done"];
        Object.values(logs).forEach((r) => {
          if (!r.date) return;
          lines.push([r.date, `"${(r.exercise || "").replace(/"/g,'""')}"`, r.set || "", r.weight || "", r.done ? "1" : "0"].join(","));
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
        a.download = "workout-log.csv";
        a.click();
      });
      try {
        await loadPlan();
        render();
      } catch (err) {
        $("banner").innerHTML = "<p>Could not load <code>plan.csv</code>. Use the hosted page, not a double-clicked file.</p>";
        console.error(err);
      }
    }
    init();
  </script>
</body>
</html>
