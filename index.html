<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Today’s workout</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --card: #ffffff;
      --ink: #1c1916;
      --mute: #5c564e;
      --line: #ddd6cb;
      --amber: #b45309;
      --amber-soft: #f3e6d4;
      --done: #166534;
      --done-bg: #ecfdf3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    header, main, footer { max-width: 820px; margin: 0 auto; padding: 16px; }
    header { padding-top: 22px; }
    h1 { font-size: 1.55rem; margin: 0 0 6px; }
    .sub { color: var(--mute); margin: 0 0 14px; }
    .today {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .today .kicker { color: var(--amber); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .today h2 { margin: 4px 0 8px; font-size: 1.45rem; }
    .equip {
      background: var(--amber-soft);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
    }
    .equip strong { display: block; margin-bottom: 4px; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin: 12px 0; }
    label { font-size: 12px; color: var(--mute); display: block; margin-bottom: 4px; }
    input, button {
      font: inherit; border-radius: 8px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); padding: 8px 10px;
    }
    button { cursor: pointer; }
    button.primary { background: var(--amber); color: #fff; border-color: var(--amber); font-weight: 600; }
    .weekdays { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .weekdays button.on { background: var(--amber); color: #fff; border-color: var(--amber); }
    .hero {
      width: 100%; border-radius: 14px; border: 1px solid var(--line);
      display: block; margin: 0 0 16px; background: #fff;
    }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 16px; margin-bottom: 14px;
    }
    .card h3 { margin: 0 0 6px; font-size: 1.15rem; }
    .meta { color: var(--mute); font-size: 14px; margin: 0 0 8px; }
    .how { margin: 0 0 12px; }
    .sets { display: flex; flex-wrap: wrap; gap: 8px; }
    .set {
      display: flex; align-items: center; gap: 6px;
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: #fff;
    }
    .set.done { border-color: var(--done); background: var(--done-bg); }
    .set input[type="number"] { width: 76px; padding: 4px 6px; }
    .note { font-size: 13px; color: var(--mute); margin-top: 10px; }
    footer { color: var(--mute); font-size: 13px; padding-bottom: 40px; }
  </style>
</head>
<body>
  <header>
    <h1>What to do today</h1>
    <p class="sub">Your 12-week plan: session, equipment, how to do each lift, then check the sets.</p>
    <div class="bar">
      <div>
        <label for="start">Plan start (week 1 Monday)</label>
        <input type="date" id="start" />
      </div>
      <div>
        <label for="date">This session</label>
        <input type="date" id="date" />
      </div>
      <button class="primary" id="export" type="button">Export log CSV</button>
    </div>
    <div class="weekdays" id="days"></div>
  </header>
  <main>
    <section class="today" id="banner"></section>
    <img class="hero" id="hero" alt="Session guide" />
    <div id="list"></div>
  </main>
  <footer>
    Thursday in this plan is recovery. Upper-body strength is Friday — tap <strong>Fri</strong> if that is the session you want.
    Rest 2–3 minutes on heavy compounds, 60–90 seconds on smaller lifts.
  </footer>
  <script>
    const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    const KEY = "recomp-logs-v1";
    const START_KEY = "recomp-start";

    const PLAN = [
      {weekday:1,focus:"Push",sort:1,exercise:"Barbell bench press",sets:4,reps:"8",equipment:"Barbell, flat bench, rack",how:"Lie on the bench, eyes under the bar. Unrack, lower to mid-chest with elbows about 45°. Press up without bouncing. Feet stay planted.",notes:"Rest 2–3 min",image:"images/fitness-monday-push.png"},
      {weekday:1,focus:"Push",sort:2,exercise:"Incline dumbbell press",sets:3,reps:"10",equipment:"Two dumbbells, incline bench (30–45°)",how:"Sit, kick the dumbbells to your shoulders, press up and slightly together. Lower to chest line with control.",image:"images/fitness-monday-push.png"},
      {weekday:1,focus:"Push",sort:3,exercise:"Seated dumbbell shoulder press",sets:3,reps:"8–10",equipment:"Two dumbbells, upright bench",how:"Sit tall. Press from ear height to lockout overhead. Don’t shrug or over-arch.",image:"images/fitness-monday-push.png"},
      {weekday:1,focus:"Push",sort:4,exercise:"Dumbbell lateral raise",sets:4,reps:"12–15",equipment:"Two light dumbbells",how:"Soft elbows. Raise to shoulder height, lead with elbows, lower slow. No swinging.",image:"images/fitness-monday-push.png"},
      {weekday:1,focus:"Push",sort:5,exercise:"Cable triceps pushdown",sets:3,reps:"10–12",equipment:"Cable stack, straight bar or rope",how:"Elbows pinned to your sides. Push down until arms straighten, then return without moving the shoulders.",image:"images/fitness-monday-push.png"},
      {weekday:1,focus:"Push",sort:6,exercise:"Incline treadmill walk",sets:1,reps:"15–20 min",equipment:"Treadmill",how:"High incline, talk-pace walk. This is the finisher, not a sprint.",notes:"Moderate",image:"images/fitness-monday-push.png"},
      {weekday:2,focus:"Pull",sort:1,exercise:"Pull-up or lat pulldown",sets:4,reps:"8–10",equipment:"Pull-up bar or lat pulldown",how:"Pull-up: dead hang, pull chest toward the bar, lower fully. Pulldown: bar to upper chest, squeeze lats.",image:"images/fitness-tuesday-pull.png"},
      {weekday:2,focus:"Pull",sort:2,exercise:"Barbell bent-over row",sets:3,reps:"8–10",equipment:"Barbell",how:"Hinge to about 45°, back flat. Pull the bar to your lower ribs, pause, lower. No jerking.",image:"images/fitness-tuesday-pull.png"},
      {weekday:2,focus:"Pull",sort:3,exercise:"Seated cable row",sets:3,reps:"10–12",equipment:"Seated cable row",how:"Sit tall, pull to the stomach, squeeze shoulder blades, don’t shrug.",image:"images/fitness-tuesday-pull.png"},
      {weekday:2,focus:"Pull",sort:4,exercise:"Cable face pull",sets:3,reps:"12–15",equipment:"Cable + rope at face height",how:"Pull the rope to your face, elbows high. Rear delts and upper back.",image:"images/fitness-tuesday-pull.png"},
      {weekday:2,focus:"Pull",sort:5,exercise:"Dumbbell biceps curl",sets:3,reps:"10–12",equipment:"Two dumbbells",how:"Elbows stay at your sides. No swing. Squeeze at the top, lower slow.",image:"images/fitness-tuesday-pull.png"},
      {weekday:2,focus:"Pull",sort:6,exercise:"Hammer curl",sets:2,reps:"10–12",equipment:"Two dumbbells",how:"Palms face each other the whole time. Same strict path as the curl.",image:"images/fitness-tuesday-pull.png"},
      {weekday:2,focus:"Pull",sort:7,exercise:"Rowing machine",sets:1,reps:"10–15 min",equipment:"Rower",how:"Moderate pace. Legs, then body, then arms — reverse to return.",image:"images/fitness-tuesday-pull.png"},
      {weekday:3,focus:"Legs",sort:1,exercise:"Back squat",sets:4,reps:"6–8",equipment:"Barbell + squat rack",how:"Bar on upper back, brace, sit between the hips. Knees track toes. Stand all the way up.",notes:"Rest 2–3 min",image:"images/fitness-wednesday-legs.png"},
      {weekday:3,focus:"Legs",sort:2,exercise:"Romanian deadlift",sets:3,reps:"8–10",equipment:"Barbell",how:"Soft knees. Push hips back, bar close to the legs, feel hamstrings. Stand by driving hips forward.",image:"images/fitness-wednesday-legs.png"},
      {weekday:3,focus:"Legs",sort:3,exercise:"Leg press",sets:3,reps:"10–12",equipment:"Leg press machine",how:"Feet mid-platform. Lower to about 90° at the knees. Don’t let the low back lift off.",image:"images/fitness-wednesday-legs.png"},
      {weekday:3,focus:"Legs",sort:4,exercise:"Walking lunge",sets:3,reps:"10/leg",equipment:"Bodyweight or dumbbells",how:"Step long enough that both knees bend. Front knee over mid-foot. Alternate legs.",image:"images/fitness-wednesday-legs.png"},
      {weekday:3,focus:"Legs",sort:5,exercise:"Machine hamstring curl",sets:3,reps:"10–12",equipment:"Lying or seated hamstring curl",how:"Curl heels toward glutes, pause, lower slow. Hips stay put.",image:"images/fitness-wednesday-legs.png"},
      {weekday:3,focus:"Legs",sort:6,exercise:"Standing calf raise",sets:4,reps:"12–15",equipment:"Calf machine or step + dumbbell",how:"Rise onto the big toe, pause, lower the heel below the step.",image:"images/fitness-wednesday-legs.png"},
      {weekday:3,focus:"Legs",sort:7,exercise:"Incline treadmill walk",sets:1,reps:"15 min",equipment:"Treadmill",how:"Moderate incline walk to finish.",image:"images/fitness-wednesday-legs.png"},
      {weekday:4,focus:"Active recovery",sort:1,exercise:"Walk",sets:1,reps:"30–45 min",equipment:"None (outside or treadmill)",how:"Easy talk-pace walk. No lifting today.",notes:"Recovery day — upper body is Friday",image:"images/fitness-recovery.png"},
      {weekday:4,focus:"Active recovery",sort:2,exercise:"Mobility or stretching",sets:1,reps:"10–20 min",equipment:"Mat or open floor",how:"Hips, mid-back, shoulders. Gentle, no bouncing.",image:"images/fitness-recovery.png"},
      {weekday:4,focus:"Active recovery",sort:3,exercise:"Hydration and sleep",sets:1,reps:"checklist",equipment:"Water",how:"Hit water, protein, and a real bedtime. That is the work today.",image:"images/fitness-recovery.png"},
      {weekday:5,focus:"Upper strength",sort:1,exercise:"Barbell bench press",sets:4,reps:"5–6",equipment:"Barbell, flat bench, rack",how:"Same as Monday, heavier only if the bar path stays clean. No bounce.",notes:"Heavier than Monday if form holds",image:"images/fitness-friday-upper.png"},
      {weekday:5,focus:"Upper strength",sort:2,exercise:"Barbell bent-over row",sets:4,reps:"6–8",equipment:"Barbell",how:"Hinge, flat back, pull to the ribs. Stay tight — this is a strength day.",image:"images/fitness-friday-upper.png"},
      {weekday:5,focus:"Upper strength",sort:3,exercise:"Standing overhead press",sets:3,reps:"6–8",equipment:"Barbell",how:"Bar at the shoulders, brace glutes, press straight up. Head through at the top.",image:"images/fitness-friday-upper.png"},
      {weekday:5,focus:"Upper strength",sort:4,exercise:"Pull-ups or assisted pull-ups",sets:3,reps:"controlled",equipment:"Pull-up bar or assisted machine",how:"Full hang to chin over the bar. Slow lower. Use a band or machine if you need it.",image:"images/fitness-friday-upper.png"},
      {weekday:6,focus:"Lower + core",sort:1,exercise:"Front squat",sets:3,reps:"6–8",equipment:"Barbell + rack",how:"Bar on the front delts, elbows high. Sit down, torso upright.",image:"images/fitness-saturday-lower-core.png"},
      {weekday:6,focus:"Lower + core",sort:2,exercise:"Bulgarian split squat",sets:3,reps:"8–10/leg",equipment:"Bench, dumbbells optional",how:"Back foot on the bench. Drop straight down. Front shin stays fairly vertical.",image:"images/fitness-saturday-lower-core.png"},
      {weekday:6,focus:"Lower + core",sort:3,exercise:"Conventional deadlift",sets:3,reps:"5",equipment:"Barbell + plates",how:"Bar over mid-foot. Push the floor away, stand tall, lower with control. Moderate load.",notes:"Moderate volume",image:"images/fitness-saturday-lower-core.png"},
      {weekday:6,focus:"Lower + core",sort:4,exercise:"Hanging leg raise",sets:3,reps:"8–12",equipment:"Pull-up bar or captain’s chair",how:"Hang still. Raise the legs with the abs, not a swing.",image:"images/fitness-saturday-lower-core.png"},
      {weekday:6,focus:"Lower + core",sort:5,exercise:"Kneeling cable crunch",sets:3,reps:"10–15",equipment:"Cable + rope",how:"Kneel facing the stack. Crunch ribs toward hips. Don’t yank with the arms.",image:"images/fitness-saturday-lower-core.png"},
      {weekday:6,focus:"Lower + core",sort:6,exercise:"Forearm plank",sets:3,reps:"30–60 sec",equipment:"Mat",how:"Elbows under shoulders, body in one line. Squeeze glutes. Breathe.",image:"images/fitness-saturday-lower-core.png"},
      {weekday:0,focus:"Recovery",sort:1,exercise:"Easy walk (optional)",sets:1,reps:"as desired",equipment:"None",how:"Optional easy walk. No structured lifting.",image:"images/fitness-recovery.png"},
      {weekday:0,focus:"Recovery",sort:2,exercise:"Prep food for the week",sets:1,reps:"checklist",equipment:"Kitchen",how:"Get protein and produce ready so the training week doesn’t stall.",image:"images/fitness-recovery.png"},
      {weekday:0,focus:"Recovery",sort:3,exercise:"Review last week’s log",sets:1,reps:"checklist",equipment:"This page",how:"Export the CSV if you want a backup. Set next week’s loads from what you actually lifted.",image:"images/fitness-recovery.png"}
    ];

    const $ = (id) => document.getElementById(id);

    function loadLogs() {
      try { return JSON.parse(localStorage.getItem(KEY) || "{}"); }
      catch { return {}; }
    }
    function saveLogs(logs) { localStorage.setItem(KEY, JSON.stringify(logs)); }

    function weekNumber(start, date) {
      const s = new Date(start + "T00:00:00");
      const d = new Date(date + "T00:00:00");
      return Math.min(12, Math.max(1, Math.floor((d - s) / 86400000 / 7) + 1));
    }
    function logKey(date, exercise, set) { return date + "|" + exercise + "|" + set; }

    function weekday() {
      const picked = $("days").dataset.weekday;
      if (picked !== undefined) return Number(picked);
      return new Date($("date").value + "T00:00:00").getDay();
    }

    function render() {
      const date = $("date").value;
      const wd = weekday();
      const rows = PLAN.filter((r) => r.weekday === wd).sort((a, b) => a.sort - b.sort);
      const week = weekNumber($("start").value, date);
      const focus = rows[0] ? rows[0].focus : "—";
      const gear = [...new Set(rows.map((r) => r.equipment))];

      $("banner").innerHTML = `
        <div class="kicker">Week ${week} of 12 · ${DAYS[wd]}</div>
        <h2>Today: ${focus}</h2>
        <div class="equip"><strong>Bring / use</strong>${gear.join(" · ")}</div>
        ${wd === 4 ? "<p class='note'>This plan’s Thursday is recovery. Upper strength is Friday — tap Fri above if you came to lift upper body.</p>" : ""}
      `;

      const hero = $("hero");
      if (rows[0]) { hero.src = rows[0].image; hero.hidden = false; }
      else hero.hidden = true;

      const logs = loadLogs();
      $("list").innerHTML = rows.map((r) => {
        let sets = "";
        for (let i = 1; i <= r.sets; i++) {
          const k = logKey(date, r.exercise, i);
          const rec = logs[k] || {};
          sets += `<label class="set ${rec.done ? "done" : ""}">
            <input type="checkbox" data-k="${k}" data-ex="${r.exercise}" data-set="${i}" ${rec.done ? "checked" : ""} />
            Set ${i}
            <input type="number" min="0" step="0.5" placeholder="lb" data-w="${k}" value="${rec.weight || ""}" />
          </label>`;
        }
        return `<article class="card">
          <h3>${r.sort}. ${r.exercise}</h3>
          <p class="meta"><strong>${r.sets} × ${r.reps}</strong> · Equipment: ${r.equipment}</p>
          <p class="how">${r.how}</p>
          <div class="sets">${sets}</div>
          ${r.notes ? `<p class="note">${r.notes}</p>` : ""}
        </article>`;
      }).join("");

      document.querySelectorAll("#days button").forEach((b) => {
        b.classList.toggle("on", Number(b.dataset.d) === wd);
      });
    }

    function init() {
      const iso = new Date().toISOString().slice(0, 10);
      $("date").value = iso;
      $("start").value = localStorage.getItem(START_KEY) || "2026-07-28";
      $("days").innerHTML = DAYS.map((n, i) => `<button type="button" data-d="${i}">${n.slice(0,3)}</button>`).join("");
      $("days").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        $("days").dataset.weekday = b.dataset.d;
        render();
      });
      $("date").addEventListener("change", () => { delete $("days").dataset.weekday; render(); });
      $("start").addEventListener("change", () => { localStorage.setItem(START_KEY, $("start").value); render(); });
      $("list").addEventListener("change", (e) => {
        const t = e.target;
        const logs = loadLogs();
        const date = $("date").value;
        if (t.dataset.k) {
          logs[t.dataset.k] = Object.assign(logs[t.dataset.k] || {}, { date, exercise: t.dataset.ex, set: t.dataset.set, done: t.checked });
        }
        if (t.dataset.w) {
          logs[t.dataset.w] = Object.assign(logs[t.dataset.w] || {}, { date, weight: t.value });
        }
        saveLogs(logs);
        render();
      });
      $("export").addEventListener("click", () => {
        const logs = loadLogs();
        const lines = ["date,exercise,set,weight,done"];
        Object.values(logs).forEach((r) => {
          if (!r.date) return;
          lines.push([r.date, `"${(r.exercise || "").replace(/"/g,'""')}"`, r.set || "", r.weight || "", r.done ? "1" : "0"].join(","));
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
        a.download = "workout-log.csv";
        a.click();
      });
      render();
    }
    init();
  </script>
</body>
</html>
